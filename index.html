  function renderSongTable(tracks, isSpotifyView = false) {
    if (!tracks.length) {
      return `<div class="empty-state" style="padding: 32px;"><div class="empty-sub">No tracks found in this section.</div></div>`;
    }

    return `
      <table class="table">
        <thead>
          <tr>
            <th class="col-num">#</th>
            <th class="col-title">Title</th>
            <th class="col-artist">Artist</th>
            <th class="col-album">Album</th>
            <th style="width:40px;"></th>
            <th class="col-dur">⏱</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody>
          ${tracks.map((t, idx) => {
            const isActive = t.id === state.currentTrackId;
            const isLiked = state.liked.has(t.id);
            const isSaved = state.tracks.some(v => v.id === t.id);
            const playIcon = (isActive && state.isPlaying) ? '<span class="equalizer"><i></i><i></i><i></i></span>' : '▶';

            return `
              <tr class="${isActive ? 'active' : ''}" data-id="${t.id}">
                <td class="col-num">
                  <span class="row-num">${idx + 1}</span>
                  <span class="row-play-btn ${isActive ? 'row-play-icon-active' : ''}" data-play-row="${t.id}">${playIcon}</span>
                </td>
                <td class="col-title">
                  <div class="song-cell">
                    <div class="song-thumb">${t.cover ? `<img src="${t.cover}">` : '♫'}</div>
                    <div class="song-info">
                      <div class="song-name">${escapeHtml(t.title)}</div>
                      <div class="song-artist-sub">${escapeHtml(t.artist)}</div>
                    </div>
                  </div>
                </td>
                <td class="col-artist">${escapeHtml(t.artist)}</td>
                <td class="col-album">${escapeHtml(t.album)}</td>
                <td style="text-align:center;">
                  <button aria-label="${isLiked ? 'Unlike' : 'Like'} ${escapeHtml(t.title)}" class="heart-btn ${isLiked ? 'active' : ''}" data-like="${t.id}">${isLiked ? '♥' : '♡'}</button>
                </td>
                <td class="col-dur">${fmtTime(t.duration)}</td>
                <td class="col-actions">
                  ${isSpotifyView ? `
                    <button class="add-vault-btn ${isSaved ? 'added' : ''}" data-spot-add="${t.id}">${isSaved ? 'In Vault' : '+ Vault'}</button>
                  ` : `
                    <button class="more-btn" data-more="${t.id}">•••</button>
                  `}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  function attachTableEvents() {
    document.querySelectorAll('.table tbody tr').forEach(row => {
      const id = row.dataset.id;
      row.ondblclick = () => {
        const rowContext = state.activeView;
        const rowPlaylistId = rowContext === 'playlist' ? state.activePlaylistId : null;
        if (id === state.currentTrackId && isSamePlaybackContext(rowContext, rowPlaylistId)) {
          togglePlayPause();
        } else {
          playTrack(id, rowContext, rowPlaylistId);
        }
      };
      
      const playBtn = row.querySelector('[data-play-row]');
      if (playBtn) playBtn.onclick = (e) => {
        e.stopPropagation();
        const rowContext = state.activeView;
        const rowPlaylistId = rowContext === 'playlist' ? state.activePlaylistId : null;
        if (id === state.currentTrackId && isSamePlaybackContext(rowContext, rowPlaylistId)) {
          togglePlayPause();
        } else {
          playTrack(id, rowContext, rowPlaylistId);
        }
      };

      const heart = row.querySelector('[data-like]');
      if (heart) heart.onclick = (e) => { e.stopPropagation(); toggleLikeTrack(id); };

      const addVault = row.querySelector('[data-spot-add]');
      if (addVault) addVault.onclick = (e) => {
        e.stopPropagation();
        const spotTrack = state.spotifyResults.find(t => t.id === id);
        if (spotTrack) {
          const isSaved = state.tracks.some(v => v.id === spotTrack.id);
          if (isSaved) {
            deleteTrackFromVault(spotTrack.id);
          } else {
            addOnlineTrackToVault(spotTrack);
          }
        }
      };

      const more = row.querySelector('[data-more]');
      if (more) more.onclick = (e) => { e.stopPropagation(); showContextMenu(e.clientX, e.clientY, id); };

      row.oncontextmenu = (e) => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, id); };
    });
  }

  let activeContextTrackId = null;

  function showContextMenu(x, y, trackId) {
    activeContextTrackId = trackId;
    const menu = $('contextMenu');
    
    const isVaultTrack = state.tracks.some(t => t.id === trackId);
    $('ctxRemoveVault').style.display = isVaultTrack ? 'flex' : 'none';
    $('ctxRemovePlaylist').style.display = state.activeView === 'playlist' ? 'flex' : 'none';

    menu.style.left = `${Math.min(x, window.innerWidth - 190)}px`;
    menu.style.top = `${Math.min(y, window.innerHeight - 220)}px`;
    menu.style.display = 'block';
  }

  function hideContextMenu() {
    $('contextMenu').style.display = 'none';
  }

  function createPlaylist() {
    const name = prompt("Enter playlist name:", "Vault Playlist");
    if (!name || !name.trim()) return;

    const id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
    state.playlists[id] = { id, name: name.trim(), trackIds: [] };
    saveData();
    renderPlaylistSidebar();
    navigateTo('playlist', id);
    showToast("Playlist created");
  }

  function renamePlaylist(id) {
    const pl = state.playlists[id];
    if (!pl) return;
    const newName = prompt("Rename playlist:", pl.name);
    if (!newName || !newName.trim()) return;

    pl.name = newName.trim();
    saveData();
    renderPlaylistSidebar();
    renderCurrentView();
  }

  function deletePlaylist(id) {
    if (!confirm("Are you sure you want to delete this playlist?")) return;
    delete state.playlists[id];
    saveData();
    renderPlaylistSidebar();
    navigateTo('library');
    showToast("Playlist deleted");
  }

  function addTrackToPlaylist(trackId) {
    const plKeys = Object.keys(state.playlists);
    if (!plKeys.length) {
      showToast("Create a playlist first!");
      return;
    }

    const plNames = plKeys.map((k, i) => `${i + 1}. ${state.playlists[k].name}`).join('\n');
    const choice = prompt(`Select playlist number:\n${plNames}`);
    const idx = parseInt(choice, 10) - 1;

    if (Number.isInteger(idx) && plKeys[idx]) {
      const pl = state.playlists[plKeys[idx]];
      if (!pl.trackIds.includes(trackId)) {
        pl.trackIds.push(trackId);
        saveData();
        showToast(`Added to ${pl.name}`);
        renderCurrentView();
      }
    }
  }

  function renderPlaylistSidebar() {
    const list = $('playlistList');
    list.innerHTML = Object.values(state.playlists).map(pl => `
      <div class="playlist-item ${state.activeView === 'playlist' && state.activePlaylistId === pl.id ? 'active' : ''}" data-id="${pl.id}">
        <span>🎵 ${escapeHtml(pl.name)}</span>
      </div>
    `).join('');

    list.querySelectorAll('.playlist-item').forEach(el => {
      el.onclick = () => navigateTo('playlist', el.dataset.id);
    });
  }

  function updateQueueUI() {
    $('queueBadge').textContent = state.queue.length;
    $('queueBadge').style.display = state.queue.length ? 'inline-block' : 'none';

    const container = $('queueList');
    let currentTrack = state.tracks.find(t => t.id === state.currentTrackId);
    if (!currentTrack && state.spotifyResults) currentTrack = state.spotifyResults.find(t => t.id === state.currentTrackId);
    
    const upcomingTracks = getUpcomingTracks(10);

    let html = '';

    if (currentTrack) {
      html += `
        <div class="queue-section-title">Now Playing</div>
        <div class="queue-item" style="background: rgba(0,242,254,0.08); border-left: 3px solid var(--vault-cyan);">
          <div class="song-thumb" style="width:36px; height:36px; font-size:14px;">${currentTrack.cover ? `<img src="${currentTrack.cover}">` : '♫'}</div>
          <div class="song-info" style="flex:1;">
            <div class="song-name" style="color: var(--vault-cyan); font-size:12px;">${escapeHtml(currentTrack.title)}</div>
            <div class="song-artist-sub" style="display:block; font-size: 10px;">${escapeHtml(currentTrack.artist)}</div>
          </div>
        </div>
      `;
    }

    if (upcomingTracks.length > 0) {
      html += `<div class="queue-section-title" style="margin-top: 14px;">Next Up (Next 10)</div>`;
      upcomingTracks.forEach((item) => {
        const t = item.track;
        html += `
          <div class="queue-item" data-queue-play="${t.id}" data-is-queue="${item.isQueue}" data-queue-idx="${item.queueIndex}">
            <div class="song-thumb" style="width:32px; height:32px; font-size:12px;">${t.cover ? `<img src="${t.cover}">` : '♫'}</div>
            <div class="song-info" style="flex:1;">
              <div class="song-name" style="font-size: 12px;">${escapeHtml(t.title)}</div>
              <div class="song-artist-sub" style="display:block; font-size: 10px;">${escapeHtml(t.artist)}</div>
            </div>
            <div class="queue-item-actions">
              ${item.isQueue ? `
                <span class="queue-tag">Queue</span>
                <button class="queue-action-btn" title="Remove" data-remove-queue="${item.queueIndex}">✕</button>
              ` : `
                <button class="queue-action-btn" title="Add Up Next" data-add-queue="${t.id}">+Up Next</button>
              `}
            </div>
          </div>
        `;
      });
    }

    container.innerHTML = html || `<div style="color: #506078; font-size: 12px; text-align: center; padding: 24px;">No upcoming tracks in queue</div>`;

    container.querySelectorAll('[data-queue-play]').forEach(row => {
      row.onclick = (e) => {
        if (e.target.closest('button')) return;
        const trackId = row.dataset.queuePlay;
        const isQueue = row.dataset.isQueue === 'true';
        const qIdx = parseInt(row.dataset.queueIdx, 10);
        playFromQueue(trackId, isQueue, qIdx);
      };
    });

    container.querySelectorAll('[data-remove-queue]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.removeQueue, 10);
        if (idx !== -1) {
          state.queue.splice(idx, 1);
          saveData();
          updateQueueUI();
        }
      };
    });

    container.querySelectorAll('[data-add-queue]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        addToQueue(btn.dataset.addQueue);
      };
    });
  }

  function updatePlayerUI() {
    let t = state.tracks.find(x => x.id === state.currentTrackId);
    if (!t && state.spotifyResults) t = state.spotifyResults.find(x => x.id === state.currentTrackId);
    if (!t) {
      $('playerTitle').textContent = 'Nothing playing';
      $('playerArtist').textContent = 'Select music to start';
      $('playerArt').innerHTML = '♫';
      $('playerHeart').textContent = '♡';
      $('playerHeart').classList.remove('active');
      syncPlaybackVisuals();
      return;
    }

    $('playerTitle').textContent = t.title || 'Unknown title';
    $('playerArtist').textContent = t.artist || 'Unknown artist';
    $('playerArt').innerHTML = t.cover ? `<img src="${escapeHtml(t.cover)}" alt="">` : '♫';
    $('playerHeart').textContent = state.liked.has(t.id) ? '♥' : '♡';
    $('playerHeart').classList.toggle('active', state.liked.has(t.id));
    $('playerHeart').setAttribute('aria-label', state.liked.has(t.id) ? 'Unlike current song' : 'Like current song');
    syncPlaybackVisuals();
  }

  function toggleShuffle() {
    state.shuffle = !state.shuffle;
    $('btnShuffle').classList.toggle('active', state.shuffle);
    if ($('homeShuffleBtn')) $('homeShuffleBtn').classList.toggle('active', state.shuffle);
    if (state.shuffle) rebuildShuffledOrder();
    updateQueueUI();
    renderCurrentView();
    showToast(`Shuffle ${state.shuffle ? 'On' : 'Off'}`);
  }

  function toggleRepeat() {
    state.repeat = state.repeat === 'off' ? 'all' : (state.repeat === 'all' ? 'one' : 'off');
    $('btnRepeat').classList.toggle('active', state.repeat !== 'off');
    $('btnRepeat').textContent = state.repeat === 'one' ? '↻¹' : '↻';
    updateQueueUI();
    showToast(`Repeat ${state.repeat.toUpperCase()}`);
  }

  function updateRangeVisuals() {
    const p = $('progressSlider');
    const v = $('volSlider');
    if (p) p.style.setProperty('--value', `${Number(p.value) / 10}%`);
    if (v) v.style.setProperty('--value', `${Number(v.value) * 100}%`);
  }

  function syncPlaybackVisuals() {
    const now = document.querySelector('.now-playing');
    if (now) now.classList.toggle('is-active', state.isPlaying);
    const playBtn = $('btnPlay');
    if (playBtn) playBtn.textContent = state.isPlaying ? '❚❚' : '▶';
    updateBigPlayButtons();
  }

  audio.ontimeupdate = () => {
    if (!audio.duration || !Number.isFinite(audio.duration)) return;
    const pct = (audio.currentTime / audio.duration) * 1000;
    $('progressSlider').value = pct;
    $('currentTime').textContent = fmtTime(audio.currentTime);
    $('duration').textContent = fmtTime(audio.duration);
    updateRangeVisuals();
  };

  audio.onloadedmetadata = async () => {
    let t = state.tracks.find(x => x.id === state.currentTrackId);
    if (!t && state.spotifyResults) t = state.spotifyResults.find(x => x.id === state.currentTrackId);
    if (t) {
      if (!t.duration || Math.abs((t.duration || 0) - audio.duration) > 1) {
        t.duration = audio.duration;
        if (state.tracks.some(x => x.id === t.id)) await saveTrackToDB(t);
      }
      $('duration').textContent = fmtTime(audio.duration);
    }
    updateRangeVisuals();
  };

  audio.onplay = () => { state.isPlaying = true; syncPlaybackVisuals(); };
  audio.onpause = () => { state.isPlaying = false; syncPlaybackVisuals(); };
  audio.onerror = () => {
    state.isPlaying = false;
    syncPlaybackVisuals();
  };
  audio.onended = playNext;

  $('btnPlay').onclick = togglePlayPause;
  $('btnNext').onclick = playNext;
  $('btnPrev').onclick = playPrev;
  $('btnShuffle').onclick = toggleShuffle;
  $('btnRepeat').onclick = toggleRepeat;

  $('playerHeart').onclick = () => {
    if (state.currentTrackId) toggleLikeTrack(state.currentTrackId);
  };

  $('progressSlider').oninput = (e) => {
    if (audio.duration && Number.isFinite(audio.duration)) {
      audio.currentTime = (parseFloat(e.target.value) / 1000) * audio.duration;
      updateRangeVisuals();
    }
  };

  $('volSlider').oninput = (e) => {
    audio.volume = parseFloat(e.target.value);
    audio.muted = false;
    $('btnMute').textContent = audio.volume === 0 ? '🔇' : '🔊';
    updateRangeVisuals();
    saveData();
  };

  $('btnMute').onclick = () => {
    audio.muted = !audio.muted;
    $('btnMute').textContent = audio.muted ? '🔇' : '🔊';
  };

  $('btnQueueToggle').onclick = () => {
    $('queuePanel').classList.toggle('open');
    updateQueueUI();
  };

  $('clearQueueBtn').onclick = () => {
    state.queue = [];
    state.queueResumeTrackId = null;
    saveData();
    updateQueueUI();
    showToast("Queue cleared");
  };

  let searchTimer = null;
  $('searchInput').oninput = (e) => {
    state.searchQuery = e.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      renderCurrentView();
      updateQueueUI();
    }, 90);
  };

  const overlay = $('dropOverlay');
  let dragDepth = 0;

  document.addEventListener('dragenter', (e) => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    dragDepth++;
    overlay.classList.add('active');
  });

  document.addEventListener('dragover', (e) => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  });

  document.addEventListener('dragleave', (e) => {
    if (!e.dataTransfer?.types?.includes('Files')) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) overlay.classList.remove('active');
  });

  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    overlay.classList.remove('active');

    const items = e.dataTransfer?.items;
    const files = [];
    if (items && items.length) {
      for (const item of items) {
        if (item.kind !== 'file') continue;
        const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
        if (entry) files.push(...await scanDirectoryEntry(entry));
        else { const f = item.getAsFile(); if (f) files.push(f); }
      }
    } else if (e.dataTransfer?.files) {
      files.push(...e.dataTransfer.files);
    }
    await processFiles(files);
  });

  $('navHome').onclick = () => navigateTo('home');
  $('navSpotify').onclick = () => navigateTo('spotify');
  $('navLibrary').onclick = () => navigateTo('library');
  $('navLiked').onclick = () => navigateTo('liked');
  $('createPlaylistBtn').onclick = createPlaylist;

  function goHistory(position) {
    if (position < 0 || position >= state.historyStack.length) return;
    state.historyPos = position;
    const raw = state.historyStack[position] || 'home:';
    const colon = raw.indexOf(':');
    const view = colon === -1 ? raw : raw.slice(0, colon);
    const playlistId = colon === -1 ? null : (raw.slice(colon + 1) || null);
    navigateTo(view, playlistId, { recordHistory: false, animate: true });
  }

  $('btnBack').onclick = () => { if (state.historyPos > 0) goHistory(state.historyPos - 1); };
  $('btnForward').onclick = () => { if (state.historyPos < state.historyStack.length - 1) goHistory(state.historyPos + 1); };

  $('ctxPlay').onclick = () => {
    hideContextMenu();
    const ctx = state.activeView;
    const plId = ctx === 'playlist' ? state.activePlaylistId : null;
    if (activeContextTrackId === state.currentTrackId && isSamePlaybackContext(ctx, plId)) {
      togglePlayPause();
    } else {
      playTrack(activeContextTrackId, ctx, plId);
    }
  };
  $('ctxQueue').onclick = () => { hideContextMenu(); addToQueue(activeContextTrackId); };
  $('ctxLike').onclick = () => { hideContextMenu(); toggleLikeTrack(activeContextTrackId); };
  $('ctxAddPlaylist').onclick = () => { hideContextMenu(); addTrackToPlaylist(activeContextTrackId); };
  $('ctxRemovePlaylist').onclick = () => {
    hideContextMenu();
    if (state.activePlaylistId && state.playlists[state.activePlaylistId]) {
      const pl = state.playlists[state.activePlaylistId];
      pl.trackIds = pl.trackIds.filter(id => id !== activeContextTrackId);
      saveData();
      renderCurrentView();
      updateQueueUI();
      showToast("Removed from playlist");
    }
  };
  $('ctxRemoveVault').onclick = () => {
    hideContextMenu();
    if (activeContextTrackId) {
      deleteTrackFromVault(activeContextTrackId);
    }
  };

  document.addEventListener('click', (e) => {
    hideContextMenu();

    const queuePanel = $('queuePanel');
    const queueToggleBtn = $('btnQueueToggle');

    if (queuePanel.classList.contains('open') && 
        !queuePanel.contains(e.target) && 
        !queueToggleBtn.contains(e.target)) {
      queuePanel.classList.remove('open');
    }
  });

  $('btnChooseSongs').onclick = () => $('fileInput').click();
  $('btnChooseFolder').onclick = () => $('folderInput').click();
  $('miniDropBtn').onclick = () => $('folderInput').click();

  $('fileInput').onchange = (e) => { processFiles(e.target.files); e.target.value = ''; };
  $('folderInput').onchange = (e) => { processFiles(e.target.files); e.target.value = ''; };

  window.onkeydown = (e) => {
    if (e.key === 'Escape') { hideContextMenu(); $('queuePanel').classList.remove('open'); return; }
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

    if (e.code === 'Space') {
      e.preventDefault();
      togglePlayPause();
    } else if (e.code === 'ArrowRight') {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    } else if (e.code === 'ArrowLeft') {
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    } else if (e.code === 'KeyN') {
      playNext();
    } else if (e.code === 'KeyP') {
      playPrev();
    }
  };

  async function initApp() {
    try { await initDB(); } catch (err) {
      db = null;
      showToast('Offline storage is unavailable; this session will still work.');
    }
    const savedTracks = await loadTracksFromDB();
    state.tracks = (savedTracks || []).sort((a,b) => String(a.title || '').localeCompare(String(b.title || '')));
    await loadPersistedData();
    // Remove stale queue/library references after a browser storage restore.
    const validIds = new Set(state.tracks.map(t => t.id));
    state.queue = state.queue.filter(id => validIds.has(id));
    renderPlaylistSidebar();
    navigateTo('home', null, { recordHistory: false, animate: false });
    updateQueueUI();
    updatePlayerUI();
    updateRangeVisuals();
    $('btnShuffle').classList.toggle('active', state.shuffle);
    $('btnRepeat').classList.toggle('active', state.repeat !== 'off');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const root = $('appRoot');
        if (root) root.classList.add('loaded');
      });
    });
  }

  window.addEventListener('beforeunload', () => {
    state.objectUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e) {} });
  });

  initApp();
})();
</script>
</body>
</html>
